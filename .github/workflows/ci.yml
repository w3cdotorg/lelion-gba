name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build ROM (devkitARM)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - run: make && make DEBUG_HOOKS=1
      - uses: actions/upload-artifact@v4
        with:
          name: lelion.gba
          path: lelion.gba
      - uses: actions/upload-artifact@v4
        with:
          name: lelion-debug.gba
          path: lelion-debug.gba

  test:
    name: Headless tests (libmgba)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lelion.gba
      - uses: actions/download-artifact@v4
        with:
          name: lelion-debug.gba
      - run: sudo apt-get update && sudo apt-get install -y libmgba-dev
      - run: HARNESS_CFLAGS="" tests/run.sh lelion-debug.gba lelion.gba
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: tests/out/*.ppm

  release:
    name: Release ROM
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lelion.gba
      - uses: softprops/action-gh-release@v2
        with:
          files: lelion.gba
